name: Build & Publish Windows 11 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win11:
    name: Build AegisROM Win11 x64 (.EXE & .ZIP)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: npm install

      - name: Type-check frontend & server
        run: npm run lint

      - name: Build Windows 11 Setup.exe, Portable.exe & Release ZIP
        run: npm run release:win

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AegisROM-Win11-x64-Package
          path: |
            public/downloads/AegisROM-Setup-v*-Win11-x64.exe
            public/downloads/AegisROM-Portable-Win11-x64.exe
            public/downloads/aegis-scanner-win11-x64.exe
            public/downloads/AegisROM-v*-Win11-x64.zip
            public/downloads/version.json

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            public/downloads/AegisROM-Setup-v*-Win11-x64.exe
            public/downloads/AegisROM-Portable-Win11-x64.exe
            public/downloads/aegis-scanner-win11-x64.exe
            public/downloads/AegisROM-v*-Win11-x64.zip
            public/downloads/version.json
          generate_release_notes: true
