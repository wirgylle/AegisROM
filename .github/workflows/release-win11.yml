name: Release (Windows 11 x64)

# Публикация релиза: создать тег vX.Y.Z на коммите в main и запушить его.
#   git checkout main && git pull
#   git tag v0.5.5 && git push origin v0.5.5
# Версия в теге должна совпадать с "version" в package.json.

# Каждый push в dev тоже собирает exe: тестовая сборка в Actions → Artifacts (без публикации).

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win11:
    name: Build AegisROM Win11 x64 (.exe + .zip)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag is on main and matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"; exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag must point to a commit on main"; exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build Setup.exe, Portable.exe & ZIP
        run: npm run release:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AegisROM-Win11-x64-${{ github.ref_name }}-${{ github.sha }}
          retention-days: 14
          path: |
            public/downloads/AegisROM-Setup-v*-Win11-x64.exe
            public/downloads/AegisROM-Portable-Win11-x64.exe
            public/downloads/aegis-scanner-win11-x64.exe
            public/downloads/AegisROM-v*-Win11-x64.zip
            public/downloads/version.json

      # Заметки к релизу берутся из docs/releases/<тег>.md, если файл есть.
      - name: Find release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          f="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: |
            public/downloads/AegisROM-Setup-v*-Win11-x64.exe
            public/downloads/AegisROM-Portable-Win11-x64.exe
            public/downloads/aegis-scanner-win11-x64.exe
            public/downloads/AegisROM-v*-Win11-x64.zip
            public/downloads/version.json
