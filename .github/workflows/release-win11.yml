name: Release (Windows 11 x64 + macOS)

# RU: Публикация релиза. Actions → «Release (Windows 11 x64)» → Run workflow,
#     ветка main, в поле version впиши версию из package.json (например 0.5.5).
#     Workflow сам создаёт черновик релиза, прикладывает файлы, публикует его и ставит тег vX.Y.Z.
#     Релиз вручную в интерфейсе Releases не создавай: в репо включены неизменяемые релизы,
#     к уже опубликованному релизу файлы приложить нельзя.
# EN: To publish a release: Actions → "Release (Windows 11 x64)" → Run workflow on main,
#     set version to the package.json version (e.g. 0.5.5). The workflow creates a draft
#     release, uploads the assets, then publishes it and creates the vX.Y.Z tag.
#     Don't create the release by hand in the Releases UI: immutable releases are enabled,
#     so assets can't be added after a release is published.
#
# RU: Каждый push в dev собирает тестовую сборку с версией 0.6.1-dev+<коммит> и публикует её
#     как Pre-release с тегом dev-build-<номер> (последний релиз «Latest» остаётся стабильным).
#     Хранятся 3 последние dev-сборки, старые удаляются. Копия есть и в Actions → Artifacts.
# EN: Every push to dev builds a test build versioned 0.6.1-dev+<commit> and publishes it
#     as a Pre-release tagged dev-build-<n> ("Latest" stays on the stable release).
#     The 3 newest dev builds are kept, older ones are deleted. A copy is also in Actions → Artifacts.

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without "v" (must match package.json) / Версия без "v", как в package.json'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-win11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    name: Build AegisROM macOS universal (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve dev build version
        if: github.ref == 'refs/heads/dev'
        run: |
          PKG="$(node -p "require('./package.json').version")"
          echo "AEGIS_BUILD_VERSION=${PKG}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: npm ci

      - name: Build AegisROM.app & .dmg
        env:
          SS_DEV_ID: ${{ secrets.SS_DEV_ID }}
          SS_DEV_PASSWORD: ${{ secrets.SS_DEV_PASSWORD }}
        run: npm run release:mac

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisROM-macOS-dmg
          retention-days: 14
          path: public/downloads/AegisROM-v*-macOS-universal.dmg

  build-win11:
    name: Build AegisROM Win11 x64 (.exe + .zip)
    runs-on: ubuntu-latest
    needs: build-macos
    # RU: Windows публикуется, даже если Mac-сборка упала (проверка для vX.Y.Z — ниже).
    # EN: Windows publishes even if the Mac build failed (vX.Y.Z is checked below).
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: rel
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_VERSION" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "Release must be run on main / Релиз запускается только с main"; exit 1
            fi
            echo "tag=v${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check release is on main and matches package.json
        if: steps.rel.outputs.tag != ''
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG"; exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit must be on main"; exit 1
          fi

      # RU: Для dev к версии добавляется короткий хеш коммита. EN: dev builds get the short commit hash.
      - name: Resolve dev build version
        id: devver
        if: github.ref == 'refs/heads/dev' && steps.rel.outputs.tag == ''
        run: |
          PKG="$(node -p "require('./package.json').version")"
          VER="${PKG}+${GITHUB_SHA::7}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=dev-build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "AEGIS_BUILD_VERSION=$VER" >> "$GITHUB_ENV"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build Setup.exe, Portable.exe & ZIP
        env:
          # RU: ключ разработчика ScreenScraper (необязательно). EN: ScreenScraper developer key (optional).
          SS_DEV_ID: ${{ secrets.SS_DEV_ID }}
          SS_DEV_PASSWORD: ${{ secrets.SS_DEV_PASSWORD }}
        run: npm run release:win

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AegisROM-Win11-x64-${{ steps.devver.outputs.version || github.ref_name }}-${{ github.sha }}
          retention-days: 14
          path: |
            public/downloads/AegisROM-Setup-v*-Win11-x64.exe
            public/downloads/AegisROM-Portable-Win11-x64.exe
            public/downloads/aegis-scanner-win11-x64.exe
            public/downloads/AegisROM-v*-Win11-x64.zip
            public/downloads/version.json

      - name: Download macOS .dmg
        id: macdmg
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: AegisROM-macOS-dmg
          path: public/downloads

      - name: Require macOS .dmg for a release
        if: steps.rel.outputs.tag != ''
        run: |
          ls public/downloads/AegisROM-v*-macOS-universal.dmg >/dev/null 2>&1 \
            || { echo "macOS build failed: no .dmg / Mac-сборка не удалась"; exit 1; }

      # RU: Заметки к релизу берутся из docs/releases/<тег>.md, если файл есть.
      # EN: Release notes come from docs/releases/<tag>.md when the file exists.
      - name: Find release notes
        id: notes
        if: steps.rel.outputs.tag != ''
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          f="docs/releases/${TAG}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi

      # RU: Сначала черновик: к опубликованному неизменяемому релизу файлы не добавить.
      # EN: Draft first: assets can't be added to a published immutable release.
      - name: Create draft release with assets
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AegisROM ${{ steps.rel.outputs.tag }}
          draft: true
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            public/downloads/AegisROM-Setup-v*-Win11-x64.exe
            public/downloads/AegisROM-Portable-Win11-x64.exe
            public/downloads/aegis-scanner-win11-x64.exe
            public/downloads/AegisROM-v*-Win11-x64.zip
            public/downloads/version.json

      - name: Attach macOS .dmg to release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: gh release upload "$TAG" public/downloads/AegisROM-v*-macOS-universal.dmg --repo "$GITHUB_REPOSITORY"

      - name: Publish release
        if: steps.rel.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # RU: Dev-сборка: черновик → файлы → публикация как Pre-release (неизменяемые релизы не дают
      #     добавить файлы после публикации). Не помечается Latest, тег не попадает под v*.
      # EN: Dev build: draft → assets → publish as Pre-release (immutable releases block adding
      #     assets after publishing). Never marked Latest; the tag doesn't match v*.
      - name: Create dev pre-release (draft with assets)
        if: steps.devver.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.devver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AegisROM ${{ steps.devver.outputs.version }} (dev)
          draft: true
          prerelease: true
          make_latest: false
          body: |
            RU: Тестовая сборка из ветки `dev`, коммит ${{ github.sha }}. Не для обычного использования: может работать нестабильно. Версия в окне программы и в установщике: `${{ steps.devver.outputs.version }}`.
            EN: Test build from the `dev` branch, commit ${{ github.sha }}. Not for everyday use: may be unstable. Version shown in the app window and installer: `${{ steps.devver.outputs.version }}`.
          fail_on_unmatched_files: true
          files: |
            public/downloads/AegisROM-Setup-v*-Win11-x64.exe
            public/downloads/AegisROM-Portable-Win11-x64.exe
            public/downloads/aegis-scanner-win11-x64.exe
            public/downloads/AegisROM-v*-Win11-x64.zip
            public/downloads/version.json

      - name: Attach macOS .dmg to dev pre-release
        if: steps.devver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.devver.outputs.tag }}
        run: |
          for f in public/downloads/AegisROM-v*-macOS-universal.dmg; do
            [ -f "$f" ] || { echo "no macOS .dmg, skipping / нет .dmg, пропускаю"; exit 0; }
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY"
          done

      - name: Publish dev pre-release
        if: steps.devver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.devver.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

      # RU: Оставляем 3 последние dev-сборки. EN: Keep the 3 newest dev builds.
      - name: Delete old dev pre-releases
        if: steps.devver.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("dev-build-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r old; do
            [ -z "$old" ] && continue
            echo "Deleting $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag \
              || gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes || true
          done
