    <meta property="og:description" content="High-speed retro ROM manager, No-Intro/Redump DAT hash verifier, 1G1R deduplicator, metadata scraper, and multi-threaded Go scanner engine." />

    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script>
      // Тема до первого рендера, чтобы тёмная тема не мигала светлой. / Theme before the first render, so dark mode does not flash light.
      try {
        var s = JSON.parse(localStorage.getItem('aegisrom_settings_v1') || '{}');
        var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        if (location.hostname === '127.0.0.1' || location.hostname === 'localhost') {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            for (const reg of regs) reg.unregister();
          }).catch(() => {});
          if ('caches' in window) {
            caches.keys().then((keys) => {
              for (const k of keys) caches.delete(k);
            }).catch(() => {});
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        }
      }
    </script>
  </body>
</html>
